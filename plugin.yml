---

name: FlakeHub Cache Buildkite Plugin
description: >
  Use FlakeHub Cache, zero-configuration binary cache for Nix.
  See: https://flakehub.com/cache
author: https://github.com/DeterminateSystems
requirements:
  - bash
  - curl
  - determinate-nixd
  - magic-nix-cache
configuration:
  properties:
    upload-logs:
      description: Whether or not to upload plugin logs to the Buildkite job (default `true`).
      type: boolean
      default: true
    token-lifetime-seconds:
      description: Lifetime of the token generated by `buildkite-agent oidc` in seconds (default `3600`).
      type: integer
      default: 3600
  required: []
  additionalProperties: false
